
name: Build Hongguo TV 0.9.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x kotlin-tv/gradlew
          ./kotlin-tv/gradlew -p kotlin-tv :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HongguoTV-0.9.0-debug
          path: kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
